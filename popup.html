<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random YouTube Chapters</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Random chapters</h1>
    <section aria-labelledby="video-heading">
      <h2 id="video-heading">Current video</h2>
      <label class="switch-row" for="video-enabled">
        <span>Random chapter playback</span>
        <input id="video-enabled" type="checkbox" role="switch" disabled>
      </label>
      <p id="video-status" class="status" role="status">Checking video…</p>
    </section>
    <section aria-labelledby="options-heading">
      <h2 id="options-heading">Options</h2>
      <label class="check-row" for="allow-repeats">
        <span>Allow replaying played chapters</span>
        <input id="allow-repeats" type="checkbox" role="switch" disabled>
      </label>
      <p class="help">When off, each chapter plays once before a new round starts.</p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
